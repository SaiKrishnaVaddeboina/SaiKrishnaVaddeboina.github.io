<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Sai Krishna Vaddeboina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-family='Inter,sans-serif' font-size='52' font-weight='700' text-anchor='middle' fill='white'%3ESV%3C/text%3E%3C/svg%3E" />
  <style>
    .err-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      text-align: center;
    }
    .err-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 800;
      line-height: 1;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }
    .err-title {
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }
    .err-sub {
      color: var(--text-dim);
      font-size: 1.05rem;
      max-width: 520px;
      margin: 0 auto 36px;
    }
    .err-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .err-terminal {
      max-width: 480px;
      margin: 40px auto 0;
      background: #0d0d14;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      overflow: hidden;
      text-align: left;
      box-shadow: var(--shadow-md);
    }
    .err-terminal-body {
      padding: 20px 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      color: #d4d4dc;
    }
    .err-prompt { color: var(--accent); }
    .err-out { color: var(--text-mute); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-grid"></div>

  <main class="err-wrap">
    <div>
      <div class="err-code">404</div>
      <h1 class="err-title">This page is missing from the ledger.</h1>
      <p class="err-sub">
        The URL you tried doesn't exist on this site. Probably a stale link or a typo —
        either way, let's get you back to something that does exist.
      </p>
      <div class="err-actions">
        <a href="index.html" class="btn btn-primary">
          ← Back to Home
        </a>
        <a href="index.html#projects" class="btn btn-ghost">View Projects</a>
      </div>

      <div class="err-terminal">
        <div class="err-terminal-body">
          <div><span class="err-prompt">$</span> find . -name "this-page"</div>
          <div class="err-out">find: 'this-page': No such file or directory</div>
          <div><span class="err-prompt">$</span> exit 0</div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
